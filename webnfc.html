<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Web NFC Inspector</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --card2:#0b1220;
  --text:#f8fafc;
  --sub:#94a3b8;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:var(--card);
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

.center{
  text-align:center;
}

.icon{
  font-size:72px;
  margin:12px 0;
}

.status{
  font-size:26px;
  font-weight:700;
}

.waiting{
  color:var(--blue);
}

.success{
  color:var(--green);
}

.error{
  color:var(--red);
}

.message{
  margin-top:10px;
  color:var(--sub);
}

button{
  width:100%;
  border:none;
  background:var(--blue);
  color:white;
  padding:16px;
  border-radius:16px;
  font-size:16px;
}

.section{
  margin-top:12px;
}

.label{
  color:var(--sub);
  font-size:13px;
  margin-bottom:4px;
}

.value{
  background:var(--card2);
  border-radius:12px;
  padding:12px;
  overflow-wrap:anywhere;
}

.record{
  margin-top:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  padding:16px;
}

.type{
  font-size:18px;
  font-weight:700;
  color:#60a5fa;
  margin-bottom:12px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

  <div class="card center">

    <h1>📶 NFC Inspector</h1>

    <div class="icon">📡</div>

    <div id="status" class="status waiting">
      Ready
    </div>

    <div id="message" class="message">
      NFCスキャン待機
    </div>

  </div>

  <div class="card">
    <button onclick="startScan()">
      NFCスキャン開始
    </button>
  </div>

  <div id="output"></div>

</div>

<script>

const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");

function hex(buffer){
  return [...new Uint8Array(buffer)]
    .map(v => v.toString(16).padStart(2,"0"))
    .join(" ");
}

function tryDecode(record){

  try{
    return new TextDecoder().decode(record.data);
  }catch{
    return null;
  }

}

function setWaiting(text){
  statusEl.textContent="待機中";
  statusEl.className="status waiting";
  messageEl.textContent=text;
}

function setSuccess(text){
  statusEl.textContent="検出";
  statusEl.className="status success";
  messageEl.textContent=text;
}

function setError(text){
  statusEl.textContent="エラー";
  statusEl.className="status error";
  messageEl.textContent=text;
}

async function startScan(){

  output.innerHTML="";

  if(!("NDEFReader" in window)){
    setError("Web NFC未対応");
    return;
  }

  try{

    const ndef = new NDEFReader();

    await ndef.scan();

    setWaiting("タグを近づけてください");

    ndef.addEventListener("readingerror", ()=>{

      setError("読み取り失敗");

    });

    ndef.addEventListener("reading", event => {

      navigator.vibrate?.(200);

      setSuccess("タグ検出");

      let html = "";

      html += `
      <div class="card">

        <div class="section">
          <div class="label">UID</div>
          <div class="value">
            ${event.serialNumber || "なし"}
          </div>
        </div>

        <div class="section">
          <div class="label">Record Count</div>
          <div class="value">
            ${event.message.records.length}
          </div>
        </div>

      </div>
      `;

      event.message.records.forEach((record,index)=>{

        const decoded = tryDecode(record);

        const rawHex = hex(record.data);

        html += `
        <div class="card">

          <div class="type">
            Record ${index + 1}
          </div>

          <div class="section">
            <div class="label">recordType</div>
            <div class="value">
              ${record.recordType}
            </div>
          </div>

          <div class="section">
            <div class="label">mediaType</div>
            <div class="value">
              ${record.mediaType || "-"}
            </div>
          </div>

          <div class="section">
            <div class="label">recordId</div>
            <div class="value">
              ${record.id || "-"}
            </div>
          </div>
        `;

        if(decoded && decoded.trim()){

          html += `
          <div class="section">
            <div class="label">内容</div>
            <div class="value">
              <pre>${decoded}</pre>
            </div>
          </div>
          `;
        }

        html += `
          <div class="section">
            <div class="label">HEX</div>
            <div class="value">
              <pre>${rawHex}</pre>
            </div>
          </div>

        </div>
        `;
      });

      output.innerHTML = html;

    });

  }catch(e){

    setError(e.message);

  }

}

if("NDEFReader" in window){
  setWaiting("スキャン開始を押してください");
}else{
  setError("Web NFC未対応");
}

</script>

</body>
</html>
