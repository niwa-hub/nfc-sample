<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Web NFC Inspector</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --card2:#111827;
  --text:#f8fafc;
  --sub:#94a3b8;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:var(--card);
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

.center{
  text-align:center;
}

button{
  width:100%;
  border:none;
  border-radius:16px;
  padding:16px;
  background:var(--blue);
  color:white;
  font-size:16px;
}

.status{
  font-size:28px;
  font-weight:bold;
}

.waiting{
  color:var(--blue);
}

.success{
  color:var(--green);
}

.error{
  color:var(--red);
}

.message{
  color:var(--sub);
  margin-top:8px;
}

.label{
  color:var(--sub);
  margin-bottom:4px;
  font-size:13px;
}

.value{
  background:var(--card2);
  padding:12px;
  border-radius:12px;
  overflow:auto;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

  <div class="card center">
    <h1>📶 Web NFC Inspector</h1>

    <div id="status" class="status waiting">
      Ready
    </div>

    <div id="message" class="message">
      スキャン開始してください
    </div>
  </div>

  <div class="card">
    <button onclick="startScan()">
      NFCスキャン開始
    </button>
  </div>

  <div id="output"></div>

</div>

<script>

const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");

function setWaiting(msg){
  statusEl.textContent = "待機中";
  statusEl.className = "status waiting";
  messageEl.textContent = msg;
}

function setSuccess(msg){
  statusEl.textContent = "タグ検出";
  statusEl.className = "status success";
  messageEl.textContent = msg;
}

function setError(msg){
  statusEl.textContent = "エラー";
  statusEl.className = "status error";
  messageEl.textContent = msg;
}

function safe(v){
  try{
    if(v === undefined) return "[undefined]";
    if(v === null) return "[null]";
    return String(v);
  }catch(e){
    return "[error]";
  }
}

function inspect(obj){

  const result = {};

  try{

    const proto =
      Object.getPrototypeOf(obj);

    result.__prototype_properties =
      Object.getOwnPropertyNames(proto);

    for(const key of result.__prototype_properties){

      try{
        result[key] = obj[key];
      }catch(e){
        result[key] = "[access error]";
      }
    }

  }catch(e){

    result.error = e.message;

  }

  return result;
}

async function startScan(){

  output.innerHTML = "";

  if(!("NDEFReader" in window)){
    setError("Web NFC未対応");
    return;
  }

  try{

    const ndef = new NDEFReader();

    await ndef.scan();

    setWaiting("タグを近付けてください");

    ndef.addEventListener("readingerror", () => {

      setError("読み取り失敗");

    });

    ndef.addEventListener("reading", event => {

      navigator.vibrate?.(200);

      setSuccess("読み取り成功");

      let html = "";

      html += `
      <div class="card">
        <div class="label">Serial Number</div>
        <div class="value">
          ${safe(event.serialNumber)}
        </div>
      </div>
      `;

      let i = 1;

      for(const record of event.message.records){

        const details = inspect(record);

        html += `
        <div class="card">

          <h2>Record ${i}</h2>

          <div class="label">
            Prototype Properties
          </div>

          <div class="value">
            <pre>${JSON.stringify(
              details.__prototype_properties,
              null,
              2
            )}</pre>
          </div>

          <br>

          <div class="label">
            Record Inspection
          </div>

          <div class="value">
            <pre>${JSON.stringify(
              details,
              null,
              2
            )}</pre>
          </div>

        </div>
        `;

        i++;
      }

      output.innerHTML = html;

    });

  }catch(e){

    setError(e.message);

  }

}

</script>

</body>
</html>
